# pinas Samba config. Repo record: homelab-ops hosts/pinas/smb.conf (install by hand, then: testparm -s && smbcontrol smbd reload-config).
# Shares live under /mnt/nvme1/shares/<name> since 2026-11-04; options carried over from the old OMV config.
[global]
workgroup = WORKGROUP
server string = %h server
log level = 0
logging = syslog
passdb backend = tdbsam
obey pam restrictions = no
unix password sync = no
map to guest = never
restrict anonymous = 2
load printers = no
disable spoolss = yes
printing = bsd
printcap name = /dev/null
unix extensions = yes
use sendfile = yes
disable netbios = yes
multicast dns register = no
server min protocol = SMB2_02
fruit:aapl = yes
fruit:copyfile = yes
fruit:nfs_aces = no

# Options every OMV share had
[omv-defaults]
browseable = no
available = no
read only = no
ea support = yes
store dos attributes = no
create mask = 0664
force create mode = 0664
directory mask = 0775
force directory mode = 0775
hide special files = yes
follow symlinks = yes
wide links = no
hide dot files = yes

[ferrinMedia]
copy = omv-defaults
available = yes
browseable = yes
path = /mnt/nvme1/shares/ferrinMedia
inherit acls = yes
inherit permissions = yes
valid users = mferrin
write list = mferrin

[GeneralBackup]
copy = omv-defaults
available = yes
browseable = yes
path = /mnt/nvme1/shares/GeneralBackup
inherit acls = yes
inherit permissions = yes
valid users = mferrin
write list = mferrin

[moreMedia]
copy = omv-defaults
available = yes
browseable = yes
path = /mnt/nvme1/shares/moreMedia
valid users = mferrin
write list = mferrin
inherit acls = yes
inherit permissions = yes

[mealie-data]
copy = omv-defaults
available = yes
browseable = yes
path = /mnt/nvme1/shares/mealie-data
valid users = mferrin, @mferrin
write list = mferrin, @mferrin

[KubernetesLogs]
copy = omv-defaults
available = yes
browseable = yes
path = /mnt/nvme1/shares/KubernetesLogs
valid users = mferrin
write list = mferrin

[travel-db]
copy = omv-defaults
available = yes
browseable = yes
path = /mnt/nvme1/shares/travel-db
valid users = mferrin
write list = mferrin
hide dot files = no
