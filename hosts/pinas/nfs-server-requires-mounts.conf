# systemd drop-in for nfs-server on pinas.
# Install as /etc/systemd/system/nfs-server.service.d/requires-mounts.conf
#
# Why: if the data disks are not mounted, /export/* are just empty directories on the SD card. Starting
# NFS anyway would let clients write to the SD card and then lose that data when the disks return.
# RequiresMountsFor makes nfs-server refuse to start (and stop) unless every export is a real mount.
# The list mirrors EXPORTS in nfs-watchdog.sh and the bind mounts in /etc/fstab.
[Unit]
RequiresMountsFor=/export/ferrinMedia /export/plex-config /export/mealie-data /export/npm-data /export/whiskey-db /export/whiskey-photos /export/whiskey-app /export/KubernetesLogs /export/obsidian_data /export/travel-db
