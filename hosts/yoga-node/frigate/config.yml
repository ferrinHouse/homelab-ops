# Frigate NVR Configuration for Ferrin Homelab
# Deployed on yoga-node (192.168.1.249) - Intel Core i7-10510U with UHD Graphics

mqtt:
  enabled: true
  host: 192.168.1.254
  port: 1883
  user: mqtt
  password: "{FRIGATE_MQTT_PASSWORD}"

detectors:
  ov:
    type: openvino
    device: GPU # Uses Comet Lake Intel UHD Graphics (GT2) iGPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr

ffmpeg:
  hwaccel_args: preset-vaapi # Hardware decoding via /dev/dri/renderD128

# go2rtc handles RTSP restreaming and ultra-low latency WebRTC viewing
go2rtc:
  streams:
    wyzecam1_main:
      - rtsp://thingino:thingino@10.10.10.198:554/ch0
    wyzecam1_sub:
      - rtsp://thingino:thingino@10.10.10.198:554/ch1
    wyzecam2_main:
      - rtsp://thingino:thingino@10.10.10.111:554/ch0
    wyzecam2_sub:
      - rtsp://thingino:thingino@10.10.10.111:554/ch1
    wyzecam3_main:
      - rtsp://thingino:thingino@10.10.10.226:554/ch0
    wyzecam3_sub:
      - rtsp://thingino:thingino@10.10.10.226:554/ch1

cameras:
  wyzecam1:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/wyzecam1_sub?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/wyzecam1_main?video=copy
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 15
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 3
      motion:
        days: 0

  wyzecam2:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/wyzecam2_sub?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/wyzecam2_main?video=copy
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 15
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 3
      motion:
        days: 0

  wyzecam3:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/wyzecam3_sub?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/wyzecam3_main?video=copy
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 15
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 3
      motion:
        days: 0

objects:
  track:
    - person
    - car
    - dog
    - cat

telemetry:
  version_check: false
version: 0.18-0
