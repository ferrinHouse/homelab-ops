# Frigate NVR Configuration for Ferrin Homelab
# Deployed on yoga-node (192.168.1.249) - Intel Core i7-10510U with UHD Graphics

mqtt:
  enabled: true
  host: 192.168.1.254
  port: 1883
  user: mqtt
  password: '{FRIGATE_MQTT_PASSWORD}'

detectors:
  ov:
    type: openvino
    device: GPU # Uses Comet Lake Intel UHD Graphics (GT2) iGPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr

ffmpeg:
  hwaccel_args: preset-vaapi # Hardware decoding via /dev/dri/renderD128

# go2rtc handles RTSP restreaming and ultra-low latency WebRTC viewing
go2rtc:
  homeassistant:
    url: http://192.168.1.254:8123
    token: '{FRIGATE_HASS_TOKEN}'

  streams:
    wyzecam1_main:
      - rtsp://thingino:thingino@10.10.10.198:554/ch0
    wyzecam1_sub:
      - rtsp://thingino:thingino@10.10.10.198:554/ch1
    wyzecam2_main:
      - rtsp://thingino:thingino@10.10.10.111:554/ch0
    wyzecam2_sub:
      - rtsp://thingino:thingino@10.10.10.111:554/ch1
    wyzecam3_main:
      - rtsp://thingino:thingino@10.10.10.226:554/ch0
    wyzecam3_sub:
      - rtsp://thingino:thingino@10.10.10.226:554/ch1
    vivint_doorbell_main:
      - rtsp://user:{FRIGATE_VIVINT_RTSP_PASSWORD}@10.10.10.218:8554/Video-100
    vivint_doorbell_sub:
      - rtsp://user:{FRIGATE_VIVINT_RTSP_PASSWORD}@10.10.10.218:8554/Video-100_SD
    vivint_driveway_main:
      - rtsp://user:{FRIGATE_VIVINT_RTSP_PASSWORD}@10.10.10.218:8554/Video-108
    vivint_driveway_sub:
      - rtsp://user:{FRIGATE_VIVINT_RTSP_PASSWORD}@10.10.10.218:8554/Video-108_SD
    # Android phone running IP Webcam Pro (single H.264 1080p30 stream, no auth).
    # h264_ulaw.sdp avoids the app's malformed AAC frames seen on h264_aac.sdp.
    master_bedroom:
      - rtsp://10.10.10.102:8080/h264_ulaw.sdp

cameras:
  wyzecam1:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/wyzecam1_sub?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/wyzecam1_main?video=copy
          input_args: preset-rtsp-restream
          roles:
            - record
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 3
      motion:
        days: 0

    objects:
      track:
        - person
        - dog
        - cat
    detect:
      fps: 5
  wyzecam2:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/wyzecam2_sub?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/wyzecam2_main?video=copy
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 3
      motion:
        days: 0

    objects:
      mask:
        street:
          friendly_name: Street
          enabled: true
          coordinates: 0.002,0.441,0.988,0.503,0.997,0.007,0.003,0.011
    motion:
      mask:
        motion_mask_1:
          friendly_name: Motion Mask 1
          enabled: true
          coordinates: 0.997,0.993,0.991,0.331,0.712,0.601,0.793,0.993
  wyzecam3:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/wyzecam3_sub?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/wyzecam3_main?video=copy
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 3
      motion:
        days: 0

  vivint_doorbell:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/vivint_doorbell_sub?video=copy
          input_args: -avoid_negative_ts make_zero -fflags 
            +genpts+discardcorrupt -use_wallclock_as_timestamps 1 
            -rtsp_transport tcp -timeout 10000000
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/vivint_doorbell_main?video=copy
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 512
      height: 512
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 3
      motion:
        days: 0

    objects:
      track:
        - person
  vivint_driveway:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/vivint_driveway_sub?video=copy
          input_args: -avoid_negative_ts make_zero -fflags 
            +genpts+discardcorrupt -use_wallclock_as_timestamps 1 
            -rtsp_transport tcp -timeout 10000000
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/vivint_driveway_main?video=copy
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 720
      height: 400
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 3
      motion:
        days: 0

    objects:
      mask:
        street:
          friendly_name: Street
          enabled: true
          coordinates: 0.266,0.202,1,0.547,0.996,0.009,0.262,0.008

  # IP Webcam Pro has only one stream, so it feeds both roles; Frigate
  # downscales the 1080p feed to 640x360 for detection (VAAPI decode).
  master_bedroom:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/master_bedroom?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 3
      motion:
        days: 0
objects:
  track:
    - person
    - car
    - dog
    - cat

telemetry:
  version_check: false
version: 0.18-0
face_recognition:
  enabled: true
lpr:
  enabled: true
detect:
  enabled: true
