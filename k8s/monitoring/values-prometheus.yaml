---
# Prometheus tuning for Raspberry Pi (ARM64) and hybrid homelab
# Optimizing for lightweight metrics storage without unnecessary auxiliary pods

# Core Prometheus Server configuration
server:
  # Metric retention period to prevent unbounded storage growth on NAS
  retention: "15d"

  # Persistent storage on OpenMediaVault NAS using dynamic NFS provisioner
  persistentVolume:
    enabled: true
    storageClass: "nfs-client"
    accessModes:
      - ReadWriteOnce
    size: 20Gi

  # Resource allocation tuned for Raspberry Pi (matching Loki profile)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi

  # Internal ClusterIP service exposing Prometheus on standard HTTP port 80
  service:
    servicePort: 80

  # Home Assistant long-lived access token (secret created by ci.yaml from the
  # HA_PROMETHEUS_TOKEN GitHub secret), read by the 'homeassistant' scrape job below
  extraSecretMounts:
    - name: ha-prometheus-token
      mountPath: /etc/prometheus/secrets/ha
      secretName: ha-prometheus-token
      readOnly: true

# Alert rules. Alertmanager is disabled, so these only show on the Prometheus /alerts page
# (and in Grafana's Prometheus alert list) -- nothing is sent anywhere until Alertmanager is enabled.
# The NAS runs no node exporter, so NFS trouble is detected from its symptoms in the cluster.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: nas-nfs
        rules:
          - alert: NfsWorkloadsStuck
            expr: sum(kube_pod_container_status_waiting_reason{reason=~"ContainerCreating|CreateContainerError|CreateContainerConfigError"}) >= 2
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $value }} containers stuck starting - NAS/NFS is likely down"
              description: "See the 'NAS / NFS outage recovery' runbook in README.md."
          - alert: NfsProvisionerDown
            expr: kube_deployment_status_replicas_available{namespace="storage"} < 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "nfs-subdir-external-provisioner has no available replicas"
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[30m]) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 5 times in 30m"

# Disable Alertmanager to conserve memory (enable if routing alerts via email/webhook)
alertmanager:
  enabled: false

# Disable Pushgateway (batch jobs / ephemeral metrics not needed)
prometheus-pushgateway:
  enabled: false

# Enable Prometheus Node Exporter for host-level OS metrics (CPU, RAM, disk, network)
prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Enable Kube-State-Metrics for pod restart/crash-loop and readiness visibility
# on the golden-signals dashboard (lightweight, single pod, no persistence)
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Scrape configs for edge services outside Kubernetes
extraScrapeConfigs: |
  - job_name: 'frigate'
    metrics_path: '/api/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.168.1.249:5000']

  # Home Assistant (HAOS on Raspberry Pi) - entity availability, batteries, updates.
  # Consumed by Checkmk's Prometheus special agent for the homeassistant host.
  - job_name: 'homeassistant'
    metrics_path: '/api/prometheus'
    scrape_interval: 60s
    scrape_timeout: 30s
    authorization:
      credentials_file: /etc/prometheus/secrets/ha/token
    static_configs:
      - targets: ['192.168.1.254:8123']
