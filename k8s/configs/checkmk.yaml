# Checkmk Raw Edition - homelab monitoring server, pinned to yoga-node.
# UI:             http://192.168.1.249:30500/homelab/   (user: cmkadmin)
# Agent receiver: 192.168.1.249:30800 (cmk-agent-ctl register --server)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkmk-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkmk
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: checkmk
  template:
    metadata:
      labels:
        app: checkmk
    spec:
      nodeSelector:
        kubernetes.io/hostname: yoga-node
      containers:
      - name: checkmk
        image: checkmk/check-mk-raw:2.4.0-latest
        env:
        - name: CMK_SITE_ID
          value: homelab
        - name: CMK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: checkmk-secrets
              key: cmk-password
        - name: TZ
          value: America/New_York
        ports:
        - name: http
          containerPort: 5000
        - name: agent-receiver
          containerPort: 8000
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /homelab/
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /omd/sites
        - name: site-tmp
          mountPath: /opt/omd/sites/homelab/tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: checkmk-data
      - name: site-tmp
        emptyDir:
          medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: checkmk
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: checkmk
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30500
  - name: agent-receiver
    port: 8000
    targetPort: 8000
    nodePort: 30800
