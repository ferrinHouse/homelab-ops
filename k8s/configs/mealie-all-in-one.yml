# --- 1. Persistent Volume for Mealie App Data ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-mealie-app-pv
spec:
  capacity:
    storage: 15Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.253 # 👈 Replace with your NAS IP address
    path: "/export/mealie-data/app"
    readOnly: false
---
# --- 2. Persistent Volume Claim for Mealie App Data ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-app-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 15Gi
  storageClassName: ""
---
# --- 3. Persistent Volume for Mealie Database ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-mealie-db-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.253 # 👈 Replace with your NAS IP address
    path: "/export/mealie-data/db"
    readOnly: false
---
# --- 4. Persistent Volume Claim for Mealie Database ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-db-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
---
# --- 5. Deployment for the PostgreSQL Database ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealiedb-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealiedb
  template:
    metadata:
      labels:
        app: mealiedb
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: "mealie"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db-secret
                  key: postgres-password
            - name: POSTGRES_DB
              value: "mealiedb"
          ports:
            - containerPort: 5432
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - mealie
                - -d
                - mealiedb
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - mealie
                - -d
                - mealiedb
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: mealie-db-pvc
---
# --- 6. Service for the PostgreSQL Database ---
apiVersion: v1
kind: Service
metadata:
  name: mealiedb-service
spec:
  selector:
    app: mealiedb
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
# --- 7. Deployment for the Mealie Application ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie-app-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      # yoga-node runs Frigate, Checkmk and a Chromium kiosk and regularly exhausts RAM and swap;
      # the kernel then OOM-kills Mealie first. The image is multi-arch, so keep it on the Pis.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - yoga-node
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:latest
          # A request moves the pod out of BestEffort (oom_score_adj 1000, killed first under node
          # memory pressure); steady-state RSS is ~210Mi, with headroom for recipe imports.
          resources:
            requests:
              memory: 300Mi
              cpu: 100m
            limits:
              memory: 1Gi
          env:
            - name: TZ
              value: "America/Chicago"
            - name: BASE_URL
              value: "https://meals.ferrinhouse.org"
            - name: ALLOW_SIGNUP
              value: "true"
            - name: DB_ENGINE
              value: "postgres"
            - name: DB_TYPE
              value: "postgres"
            - name: POSTGRES_SERVER
              value: "mealiedb-service"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "mealie"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db-secret
                  key: postgres-password
            - name: POSTGRES_DB
              value: "mealiedb"
            - name: PUID
              value: "1002"
            - name: PGID
              value: "1002"
            - name: SMTP_HOST 
              value: "smtp.gmail.com"
            - name: SMTP_PORT 
              value: "587"
            - name: SMTP_USER 
              value: "mike.ferrin.84+ferrinmealplanner@gmail.com"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-app-secrets
                  key: smtp-password
            - name: SMTP_FROM_EMAIL
              value: "mike.ferrin.84+ferrinmealplanner@gmail.com"
            - name: SMTP_TLS
              value: "true"
            # Already set on the live Deployment but missing here; one worker keeps memory low
            - name: UVICORN_WORKERS
              value: "1"
          ports:
            - containerPort: 9000
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mealie-storage
              mountPath: /app/data
      volumes:
        - name: mealie-storage
          persistentVolumeClaim:
            claimName: mealie-app-pvc
---
# --- 8. Service for the Mealie Application ---
apiVersion: v1
kind: Service
metadata:
  name: mealie-app-service
spec:
  selector:
    app: mealie
  type: NodePort
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
      nodePort: 30925
