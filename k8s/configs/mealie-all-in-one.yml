# --- 1. Persistent Volume for Mealie App Data ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-mealie-app-pv
spec:
  capacity:
    storage: 15Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.253 # 👈 Replace with your NAS IP address
    path: "/export/mealie-data/app"
    readOnly: false
---
# --- 2. Persistent Volume Claim for Mealie App Data ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-app-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 15Gi
  storageClassName: ""
---
# --- 3. Persistent Volume for Mealie Database ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-mealie-db-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.253 # 👈 Replace with your NAS IP address
    path: "/export/mealie-data/db"
    readOnly: false
---
# --- 4. Persistent Volume Claim for Mealie Database ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-db-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
---
# --- 5. Deployment for the PostgreSQL Database ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealiedb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealiedb
  template:
    metadata:
      labels:
        app: mealiedb
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: "mealie"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db-secret
                  key: postgres-password
            - name: POSTGRES_DB
              value: "mealiedb"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: mealie-db-pvc
---
# --- 6. Service for the PostgreSQL Database ---
apiVersion: v1
kind: Service
metadata:
  name: mealiedb-service
spec:
  selector:
    app: mealiedb
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
# --- 7. Deployment for the Mealie Application ---
