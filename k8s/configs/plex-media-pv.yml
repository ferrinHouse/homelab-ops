apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-plex-media-pv
spec:
  capacity:
    storage: 1000Gi # Use a large size to represent your media library
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.253 # 👈 Replace with your NAS IP address
    path: "/export/ferrinMedia" # Using the name you specified before
    readOnly: false
