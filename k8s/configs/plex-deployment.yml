apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      initContainers:
        - name: fetch-audnexus
          image: alpine/git:latest
          command:
            - /bin/sh
            - -c
            - |
              git config --global --add safe.directory '*'
              PLUGIN_DIR="/config/Library/Application Support/Plex Media Server/Plug-ins/Audnexus.bundle"
              mkdir -p "/config/Library/Application Support/Plex Media Server/Plug-ins"
              if [ -d "$PLUGIN_DIR/.git" ]; then
                echo "Audnexus bundle exists, pulling latest..."
                cd "$PLUGIN_DIR" && (git pull || echo "Failed to pull latest Audnexus bundle, continuing with existing version...")
              else
                echo "Cloning Audnexus bundle..."
                git clone https://github.com/djdembeck/Audnexus.bundle.git "$PLUGIN_DIR"
              fi
          volumeMounts:
            - name: plex-config
              mountPath: /config
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:latest
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: TZ
              value: "America/Chicago"
            - name: VERSION
              value: "docker"
          ports:
            - containerPort: 32400 # Main web UI
            - containerPort: 3005
            - containerPort: 8324
            - containerPort: 32469
            - containerPort: 1900
              protocol: UDP
            - containerPort: 32410
              protocol: UDP
            - containerPort: 32412
              protocol: UDP
            - containerPort: 32413
              protocol: UDP
            - containerPort: 32414
              protocol: UDP
          volumeMounts:
            - name: plex-config
              mountPath: /config
            - name: plex-media
              mountPath: /media
      volumes:
        - name: plex-config
          persistentVolumeClaim:
            claimName: plex-config-pvc
        - name: plex-media
          persistentVolumeClaim:
            claimName: plex-media-pvc