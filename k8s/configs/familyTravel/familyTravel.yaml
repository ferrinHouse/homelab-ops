---
# 1. The Persistent Volume (The physical folder on the Pi)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: travel-site-pv
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadOnlyMany
  hostPath:
    path: /home/mferrin/familyTravel/www
    type: Directory

---
# 2. The Persistent Volume Claim (The claim ticket for the folder)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: travel-site-pvc
spec:
  storageClassName: manual
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi

---
# 3. The Deployment (The Nginx web server)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-site-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-site
  template:
    metadata:
      labels:
        app: travel-site
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html-volume
          persistentVolumeClaim:
            claimName: travel-site-pvc

---
# 4. The Service (The networking rule to access the site)
apiVersion: v1
kind: Service
metadata:
  name: travel-site-service
spec:
  type: NodePort
  selector:
    app: travel-site
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30090
