name: Deploy Monitoring Stack

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/monitoring/**'
      - 'k8s/storage/**'
      - 'k8s/configs/**'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Helm Repositories
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add nfs-provisioner https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy NFS Provisioner
        run: |
          helm upgrade --install nfs-provisioner nfs-provisioner/nfs-subdir-external-provisioner \
            --namespace storage --create-namespace \
            -f k8s/storage/values-nfs.yaml

      - name: Deploy Loki
        run: |
          helm upgrade --install loki grafana/loki \
            --namespace monitoring --create-namespace \
            -f k8s/monitoring/values-loki.yaml

      - name: Deploy Prometheus
        run: |
          helm upgrade --install prometheus prometheus-community/prometheus \
            --namespace monitoring --create-namespace \
            -f k8s/monitoring/values-prometheus.yaml

      # Must run BEFORE the Grafana upgrade: values-grafana.yaml injects GF_SMTP_USER/PASSWORD
      # from this Secret, and the pod will not start (CreateContainerConfigError) without it.
      # Reuses the Gmail account/app password that Mealie already sends mail with.
      - name: Create Grafana SMTP Secret
        run: |
          kubectl create secret generic grafana-smtp \
            --namespace monitoring \
            --from-literal=user="mike.ferrin.84+ferrinmealplanner@gmail.com" \
            --from-literal=password="${{ secrets.MEALIE_SMTP_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Grafana
        run: |
          helm upgrade --install grafana grafana/grafana \
            --namespace monitoring --create-namespace \
            -f k8s/monitoring/values-grafana.yaml

      - name: Deploy Alloy
        run: |
          helm upgrade --install alloy grafana/alloy \
            --namespace monitoring --create-namespace \
            --set-file alloy.configMap.content=k8s/monitoring/config.alloy

      - name: Create/Update Application Secrets
        run: |
          kubectl create secret generic mealie-db-secret \
            --namespace default \
            --from-literal=postgres-password="${{ secrets.MEALIE_DB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic mealie-app-secrets \
            --namespace default \
            --from-literal=smtp-password="${{ secrets.MEALIE_SMTP_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic obsidian-secrets \
            --namespace default \
            --from-literal=couchdb-password="${{ secrets.OBSIDIAN_COUCHDB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Application Workloads
        run: |
          kubectl apply -n default -f k8s/configs/mealie-all-in-one.yml
          kubectl apply -n default -f k8s/configs/obsidian-all-in-one.yml
          kubectl apply -n default -f k8s/configs/npm-all-in-one.yml
          kubectl apply -n default -f k8s/configs/plex-config-pv.yml
          kubectl apply -n default -f k8s/configs/plex-config-pvc.yml
          kubectl apply -n default -f k8s/configs/plex-media-pv.yml
          kubectl apply -n default -f k8s/configs/plex-media-pvc.yml
          kubectl apply -n default -f k8s/configs/plex-deployment.yml
          kubectl apply -n default -f k8s/configs/plex-service.yml
          kubectl apply -f k8s/configs/cloudflare-ddns.yaml
          kubectl apply -f k8s/configs/familyTravel/familyTravel.yaml

      - name: Roll Out Secret Changes
        run: |
          kubectl rollout restart deployment/mealiedb-deployment -n default
          kubectl rollout restart deployment/mealie-app-deployment -n default
          kubectl rollout restart deployment/obsidian-sync-db -n default
